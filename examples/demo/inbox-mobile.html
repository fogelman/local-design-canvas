<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="canvas:size" content="390x844">
<title>Inbox · mobile</title>
<link rel="stylesheet" href="_ds/ds.css">
</head>
<body>
<header class="topbar"><span class="logo">Inbox</span><span class="grow"></span><ds-button href="new-ticket.html">New</ds-button></header>
<main class="page" style="padding:16px">

  <div class="card">
    <ds-ticket-row subject="Can't reset my password" from="Maya Chen" status="urgent" label="Urgent" when="12m" href="ticket.html"></ds-ticket-row>
    <ds-ticket-row subject="Invoice shows the wrong address" from="Leo Martins" status="open" label="Open" when="1h" href="ticket.html"></ds-ticket-row>
    <ds-ticket-row subject="Feature request: dark mode" from="Ana Ruiz" status="open" label="Open" when="3h" href="ticket.html"></ds-ticket-row>
  </div>
</main>
</body>
</html>
