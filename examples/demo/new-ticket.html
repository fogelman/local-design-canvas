<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="canvas:size" content="1280x800">
<title>New ticket</title>
<link rel="stylesheet" href="_ds/ds.css">
</head>
<body>
<ds-topbar active="Inbox"></ds-topbar>
<main class="page" style="max-width:640px">
  <h1>New ticket</h1>
  <div class="card page">
    <label class="field">Customer<input placeholder="name@example.com"></label>
    <label class="field">Subject<input placeholder="What's the problem?"></label>
    <label class="field">Message<textarea rows="5"></textarea></label>
    <div class="row"><span class="grow"></span><ds-button variant="ghost" href="inbox.html">Cancel</ds-button><ds-button>Create ticket</ds-button></div>
  </div>
</main>
</body>
</html>
