<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/_app/viewer.css">
</head>
<body>
<div id="view">
  <div id="world">
    <div id="sections"></div>
    <div id="frames"></div>
    <div id="hover"></div>
    <div id="pins"></div>
  </div>
</div>

<div id="left" class="pill">
  <button id="pageBtn" class="txt" title="Pages"><span id="pageName">Page 1</span><svg class="chev" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></svg></button>
  <span class="sep"></span>
  <button data-tool="move" title="Move (V)"><svg viewBox="0 0 24 24" class="fill"><path d="M6 3.5l12.5 7.6-5.6 1.3-2.9 5.4z"/></svg></button>
  <button data-tool="hand" title="Hand (H) · hold Space"><svg viewBox="0 0 24 24"><path d="M8 12.5V6a1.5 1.5 0 013 0v5m0-6.5a1.5 1.5 0 013 0V11m0-5a1.5 1.5 0 013 0v5.5m0-3a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1.5a6 6 0 01-4.7-2.3L5 15.5a1.5 1.5 0 012.3-1.9l.7.9"/></svg></button>
  <button data-tool="comment" title="Comment (C)"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 117.5 7.5H4.5z"/></svg></button>
  <button data-tool="interact" title="Interact (I) · use the live page"><svg viewBox="0 0 24 24"><path d="M10 10l9.5 3.6-4.2 1.3-1.7 4.6z"/><path d="M5 5l2.2 2.2M10.5 3v3M3 10.5h3"/></svg></button>
</div>

<div id="pageMenu" class="menu" hidden></div>
<div id="pageCtx" class="menu ctx" hidden></div>
<div id="modal" hidden></div>

<div id="right" class="pill">
  <button id="presentBtn" title="Present (P)"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg></button>
  <button id="panelBtn" title="Comments"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M14.5 5v14"/></svg><i id="openCount"></i></button>
  <button id="zoomBtn" class="txt" title="Zoom"><span id="zoomPct">100%</span><svg class="chev" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></svg></button>
</div>

<div id="zoomMenu" class="menu" hidden>
  <button data-z="in">Zoom in<kbd>+</kbd></button>
  <button data-z="out">Zoom out<kbd>−</kbd></button>
  <button data-z="fit">Zoom to fit<kbd>⇧1</kbd></button>
  <button data-z="sel">Zoom to selection<kbd>⇧2</kbd></button>
  <hr>
  <button data-z="0.5">Zoom to 50%</button>
  <button data-z="1">Zoom to 100%<kbd>⇧0</kbd></button>
  <button data-z="2">Zoom to 200%</button>
</div>

<aside id="panel" hidden>
  <header><b>Comments</b><span class="grow"></span><div class="ptabs"><button data-f="open" class="on">Open</button><button data-f="resolved">Resolved</button></div></header>
  <div id="plist"></div>
</aside>

<div id="present" hidden>
  <iframe></iframe>
  <div class="bar"><button data-p="prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span id="pTitle"></span><button data-p="next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><button data-p="close" title="Exit (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
</div>

<div id="status"></div>
<div id="pop" hidden></div>
<!-- classic scripts sharing one global scope; order matters, main.js boots last -->
<script src="/_app/js/pill.js"></script>
<script src="/_app/js/core.js"></script>
<script src="/_app/js/frames.js"></script>
<script src="/_app/js/comments.js"></script>
<script src="/_app/js/ui.js"></script>
<script src="/_app/js/input.js"></script>
<script src="/_app/js/main.js"></script>
</body>
</html>
